name: TUCITA Appointment Reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger 15-minute appointment reminders
        run: |
          curl --fail --silent --show-error --max-time 45 \
            "https://tucita.com.ve/api/cron/appointment-reminders" >/dev/null
