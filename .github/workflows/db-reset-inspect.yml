name: Temporary TUCITA DB Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-reset-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MASTER_EMAIL: jorgeluisananguren@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Inspect TUCITA database safely
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured in GitHub Actions."
            exit 2
          fi
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL);
          const master=process.env.MASTER_EMAIL.toLowerCase();
          const tables=await sql`
            SELECT table_name
            FROM information_schema.tables
            WHERE table_schema='public' AND table_type='BASE TABLE'
            ORDER BY table_name`;
          console.log('PUBLIC_TABLES='+tables.map(x=>x.table_name).join(','));
          for(const {table_name} of tables){
            const safe='"'+String(table_name).replaceAll('"','""')+'"';
            const rows=await sql.query('SELECT count(*)::int AS n FROM '+safe);
            console.log('COUNT '+table_name+'='+Number(rows[0]?.n||0));
          }
          const auth=await sql`SELECT count(*)::int AS n,
            count(*) FILTER (WHERE lower(email)=lower(${master}))::int AS master_n
            FROM neon_auth."user"`;
          console.log('AUTH_USERS='+Number(auth[0]?.n||0));
          console.log('MASTER_AUTH_MATCHES='+Number(auth[0]?.master_n||0));
          const profile=await sql`SELECT count(*)::int AS n,
            count(*) FILTER (WHERE lower(email)=lower(${master}))::int AS master_n
            FROM app_user_profiles`;
          console.log('APP_PROFILES='+Number(profile[0]?.n||0));
          console.log('MASTER_PROFILE_MATCHES='+Number(profile[0]?.master_n||0));
          NODE
