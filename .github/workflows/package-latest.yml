name: Package Latest TURNAVIA
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare clean project
        run: |
          mkdir -p package/TURNAVIA
          rsync -a ./ package/TURNAVIA/ --exclude .git --exclude .github --exclude node_modules --exclude .next --exclude package
      - uses: actions/upload-artifact@v4
        with:
          name: TURNAVIA_ACTUALIZADO_TOTAL
          path: package/TURNAVIA
          if-no-files-found: error
