name: Package TURNAVIA
on:
  push:
    branches: [main]
jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare clean project folder
        run: |
          mkdir -p package/TURNAVIA
          rsync -a ./ package/TURNAVIA/ --exclude .git --exclude .github --exclude node_modules --exclude .next --exclude package
      - uses: actions/upload-artifact@v4
        with:
          name: TURNAVIA_ACTUALIZADO
          path: package/TURNAVIA
          if-no-files-found: error
