name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_AUTH_COOKIE_SECRET: ci-validation-secret-32-characters-minimum
      APP_URL: https://tucita.com.ve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
