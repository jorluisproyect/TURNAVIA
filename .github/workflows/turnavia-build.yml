name: TURNAVIA Build Check
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEON_AUTH_COOKIE_SECRET: turnavia-build-only-secret-2026-not-production-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Sync package lock
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "TURNAVIA Build Bot"
            git config user.email "actions@github.com"
            git add package-lock.json
            git commit -m "Sync package lock"
            git push
          fi

# verify latest multirubro integration
